<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Onest',sans-serif;background:#fff}a{color:inherit;text-decoration:none}a:hover{color:inherit}</style>
</helmet>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));min-height:100vh">
  <sc-for list="{{ demos }}" as="d" hint-placeholder-count="3">
    <div style="background:{{ d.bg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:72px 24px">
      <div style="font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:{{ d.label }}">{{ d.title }}</div>
      <a href="#" onMouseEnter="{{ d.enter }}" onMouseLeave="{{ d.leave }}" onFocus="{{ d.enter }}" onBlur="{{ d.leave }}" style="position:relative;display:inline-flex;align-items:center;height:56px;padding:0 30px 0 70px;border-radius:0;background:{{ d.fill }};border:1.5px solid {{ d.fill }};box-sizing:border-box;overflow:hidden;isolation:isolate;cursor:pointer">
        <span style="position:absolute;top:4px;left:4px;bottom:4px;width:{{ d.w }};border-radius:0;background:{{ d.circle }};transition:width .55s cubic-bezier(.65,0,.25,1);z-index:-1"></span>
        <span style="position:absolute;top:4px;left:4px;width:45px;height:45px;display:flex;align-items:center;justify-content:center;color:{{ d.arrow }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:translateX({{ d.ax }});transition:transform .55s cubic-bezier(.65,0,.25,1)"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </span>
        <span style="font-size:15px;font-weight:600;letter-spacing:.01em;white-space:nowrap;color:{{ d.text }};transition:color .35s ease .1s">{{ d.cta }}</span>
      </a>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { h: null };
  renderVals() {
    const V = [
      { title: 'Як у референсі', bg: '#F4F4F4', label: '#8A8A8A', fill: '#141414', circle: '#fff', arrow: '#141414', t0: '#fff', t1: '#141414', cta: 'Дивитись кейси' },
      { title: 'Брендова', bg: '#fff', label: '#8A8A8A', fill: '#FF5B2B', circle: '#fff', arrow: '#FF5B2B', t0: '#fff', t1: '#FF5B2B', cta: 'Залишити заявку' },
      { title: 'На темному фоні', bg: '#141414', label: '#8A8A8A', fill: '#fff', circle: '#FF5B2B', arrow: '#fff', t0: '#141414', t1: '#fff', cta: 'Обговорити проєкт' },
    ];
    return {
      demos: V.map((v, i) => {
        const on = this.state.h === i;
        return { ...v, w: on ? 'calc(100% - 8px)' : '45px', ax: on ? '4px' : '0px', text: on ? v.t1 : v.t0,
          enter: () => this.setState({ h: i }), leave: () => this.setState((s) => (s.h === i ? { h: null } : null)) };
      }),
    };
  }
}
</script>
</body>
</html>
