<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#141414;padding:44px 20px 28px;color:#fff;font-family:'Onest',sans-serif">
  <dc-import name="FooterLogo" size="{{ 132 }}" hint-size="132px,132px"></dc-import>
  <p style="margin:18px 0 0;font-size:15px;line-height:1.45;color:#DADADA">Маркетинг-агенція для E-commerce бізнесів B2C і B2B. Повний цикл, який допомагає продавати на локальному ринку та закордоном.</p>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 20px;margin-top:36px">
    <sc-for list="{{ footCols }}" as="col" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#8A8A8A;margin-bottom:6px">{{ col.title }}</span>
        <sc-for list="{{ col.links }}" as="lk" hint-placeholder-count="4">
          <a href="{{ lk.href }}" style="font-size:15px;line-height:1.3;color:#fff;padding:7px 0;word-break:break-word;text-decoration:none">{{ lk.label }}</a>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;gap:10px;margin-top:28px">
    <a href="#" aria-label="Telegram" style="width:44px;height:44px;border-radius:8px;background:#2A2A2A;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L3 10.5l7 3 3 7.5L21 3zM10 13.5L21 3"></path></svg></a>
    <a href="#" aria-label="Instagram" style="width:44px;height:44px;border-radius:8px;background:#2A2A2A;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5h.01"></path></svg></a>
    <a href="#" aria-label="LinkedIn" style="width:44px;height:44px;border-radius:8px;background:#2A2A2A;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 10v7M8 7h.01M12 17v-7M12 13a3 3 0 0 1 6 0v4"></path></svg></a>
    <a href="#" aria-label="YouTube" style="width:44px;height:44px;border-radius:8px;background:#2A2A2A;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="M10 9l5 3-5 3z"></path></svg></a>
  </div>
  <div style="margin-top:32px;border-top:1px solid #3A3A3A;padding-top:18px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:#8A8A8A">
    <span>© 2026 Koshman Ecom. Усі права захищені.</span>
    <a href="Privacy.dc.html" style="color:#8A8A8A;text-decoration:none">Політика конфіденційності</a>
    <a href="Terms.dc.html" style="color:#8A8A8A;text-decoration:none">Умови використання</a>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const H = { 'Головна': 'Hero.dc.html', 'Послуги': 'Services.dc.html', 'Кейси': 'Cases.dc.html', 'Як ми працюємо': 'Hero.dc.html#about', 'Про нас': 'About.dc.html', 'Відгуки': 'Hero.dc.html#reviews', 'Блог': 'Blog.dc.html', 'Контакти': 'Contacts.dc.html', "Кар'єра": 'Careers.dc.html' };
    return {
      footCols: [
        { title: 'Навігація', links: ['Головна', 'Послуги', 'Кейси', 'Як ми працюємо'] },
        { title: 'Компанія', links: ['Про нас', 'Відгуки', 'Блог', 'Контакти', "Кар'єра"] },
        { title: 'Інструменти', links: ['Калькулятор прибутку Etsy', 'Калькулятор ціноутворення Etsy', 'Etsy vs Amazon vs Shopify', 'Ресайзер зображень', 'Etsy Фінансовий Дашборд', 'SEOgenie'] },
        { title: 'Контакти', links: ['Telegram', 'hello@koshmanecom.com', '+380 00 000 00 00'] },
      ].map((col) => ({ ...col, links: col.links.map((label) => ({ label, href: H[label] || (col.title === 'Інструменти' ? 'Tools.dc.html' : label.includes('@') ? 'mailto:' + label : label.startsWith('+') ? 'tel:' + label.replace(/\s/g, '') : '#') })) })),
    };
  }
}
</script>
</body>
</html>
