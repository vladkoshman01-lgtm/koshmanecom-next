<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes mhFade{from{opacity:0}to{opacity:1}}
</style>
</helmet>
<header style="position:relative;z-index:50;background:#FF5B2B;height:64px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;font-family:'Onest',sans-serif">
  <a href="Hero.dc.html" style="color:#fff;font-weight:800;font-size:15px;line-height:1.05;letter-spacing:0.02em;text-transform:uppercase;display:flex;flex-direction:column;text-decoration:none"><span>Koshman</span><span>Ecom</span></a>
  <div style="display:flex;align-items:center;gap:8px">
    <button onClick="{{ toggleLang }}" style="height:40px;min-width:48px;padding:0 10px;border:2px solid #fff;background:transparent;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">{{ langLabel }}</button>
    <button onClick="{{ toggleMenu }}" aria-label="Меню" style="width:44px;height:44px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0">
      <span style="width:24px;height:2px;background:#fff;transition:transform .25s;transform:{{ burger1 }}"></span>
      <span style="width:24px;height:2px;background:#fff;transition:opacity .25s;opacity:{{ burger2 }}"></span>
      <span style="width:24px;height:2px;background:#fff;transition:transform .25s;transform:{{ burger3 }}"></span>
    </button>
  </div>
  <sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:58px;right:68px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;min-width:150px;z-index:60">
      <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
        <button onClick="{{ l.pick }}" style="height:48px;padding:0 18px;border:none;background:{{ l.bg }};color:{{ l.color }};font-family:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px"><span>{{ l.name }}</span><span style="font-size:13px;letter-spacing:.06em">{{ l.code }}</span></button>
      </sc-for>
    </div>
  </sc-if>
</header>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;top:64px;left:0;right:0;bottom:0;z-index:49;background:#141414;padding:28px 20px 32px;box-sizing:border-box;display:flex;flex-direction:column;overflow-y:auto;animation:mhFade .25s ease-out both;font-family:'Onest',sans-serif">
    <nav style="display:flex;flex-direction:column">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="8">
        <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="padding:14px 0;border-bottom:1px solid #2A2A2A;font-size:24px;font-weight:600;color:{{ n.color }};display:flex;justify-content:space-between;align-items:center;text-decoration:none">{{ n.label }}<span style="color:#FF5B2B;font-size:20px">→</span></a>
      </sc-for>
    </nav>
    <div style="margin-top:28px;display:flex;gap:8px">
      <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
        <button onClick="{{ l.pick }}" style="flex:1;height:48px;border:1.5px solid {{ l.border }};background:{{ l.menuBg }};color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer">{{ l.code }}</button>
      </sc-for>
    </div>
    <a href="Contacts.dc.html" style="margin-top:auto;padding-top:0;background:#FF5B2B;color:#fff;height:56px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;text-decoration:none;flex:none">Зв'яжіться з нами</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:64}}">
class Component extends DCLogic {
  state = { menu: false, langOpen: false };
  componentDidMount() { this._l = () => this.forceUpdate(); window.addEventListener('koshman-lang', this._l); }
  componentWillUnmount() { window.removeEventListener('koshman-lang', this._l); document.body.style.overflow = ''; }
  componentDidUpdate() { document.body.style.overflow = this.state.menu ? 'hidden' : ''; }
  renderVals() {
    let lang = 'UA'; try { lang = localStorage.getItem('koshman-lang') || 'UA'; } catch (e) {}
    const menu = this.state.menu;
    const pick = (code) => () => { try { localStorage.setItem('koshman-lang', code); } catch (e) {} window.dispatchEvent(new CustomEvent('koshman-lang', { detail: code })); this.setState({ langOpen: false }); };
    const page = (location.pathname.split('/').pop() || '').replace(/%20/g, ' ');
    const NAV = [['Головна', 'Hero.dc.html'], ['Послуги', 'Services.dc.html'], ['Кейси', 'Cases.dc.html'], ['Про нас', 'About.dc.html'], ['Відгуки', 'Hero.dc.html#reviews'], ['Блог', 'Blog.dc.html'], ['Інструменти', 'Tools.dc.html'], ['Контакти', 'Contacts.dc.html']];
    return {
      langLabel: lang, langOpen: this.state.langOpen, menuOpen: menu,
      toggleLang: () => this.setState((s) => ({ langOpen: !s.langOpen, menu: false })),
      toggleMenu: () => this.setState((s) => ({ menu: !s.menu, langOpen: false })),
      closeMenu: () => this.setState({ menu: false }),
      burger1: menu ? 'translateY(8px) rotate(45deg)' : 'none', burger2: menu ? '0' : '1', burger3: menu ? 'translateY(-8px) rotate(-45deg)' : 'none',
      langs: [['UA', 'Українська'], ['EN', 'English'], ['SK', 'Slovenčina']].map(([code, name]) => ({ code, name, pick: pick(code), bg: code === lang ? '#FFF1EB' : '#fff', color: code === lang ? '#FF5B2B' : '#222', border: code === lang ? '#FF5B2B' : '#3A3A3A', menuBg: code === lang ? '#FF5B2B' : 'transparent' })),
      navItems: NAV.map(([label, href]) => ({ label, href, color: href === page ? '#FF5B2B' : '#fff' })),
    };
  }
}
</script>
</body>
</html>
