<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ show }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="Згода на cookie" style="position:fixed;left:24px;bottom:24px;z-index:110;width:440px;max-width:calc(100vw - 48px);box-sizing:border-box;background:#1F1F1F;color:#fff;padding:28px;font-family:'Onest',sans-serif;box-shadow:0 18px 48px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#FF5B2B">Cookie</span>
      <span style="font-size:15px;line-height:1.55;color:#DADADA;text-wrap:pretty">Ми використовуємо необхідні cookie для роботи сайту та аналітичні — щоб розуміти, як його покращити. Детальніше в <a href="Privacy.dc.html#cookies" style="color:#fff;text-decoration:underline">Політиці конфіденційності</a>.</span>
    </div>
    <div style="display:flex;gap:10px">
      <button onClick="{{ acceptAll }}" style="flex:1;height:48px;border:none;background:#FF5B2B;color:#fff;font-family:inherit;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;cursor:pointer" style-hover="background:#E64A1C">Прийняти всі</button>
      <button onClick="{{ acceptNec }}" style="flex:1;height:48px;border:1.5px solid #4A4A4A;background:transparent;color:#fff;font-family:inherit;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;cursor:pointer" style-hover="border-color:#fff">Лише необхідні</button>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:300}}">
class Component extends DCLogic {
  state = { choice: null, ready: false };
  componentDidMount() { let c = null; try { c = localStorage.getItem('kc-cookie-consent'); } catch (e) {} this.setState({ choice: c, ready: true }); }
  set(v) { try { localStorage.setItem('kc-cookie-consent', v); } catch (e) {} window.dispatchEvent(new CustomEvent('kc-cookie-consent', { detail: v })); this.setState({ choice: v }); }
  renderVals() {
    return { show: this.state.ready && !this.state.choice, acceptAll: () => this.set('all'), acceptNec: () => this.set('necessary') };
  }
}
</script>
</body>
</html>
